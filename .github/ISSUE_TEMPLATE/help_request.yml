name: Help request
description: You are stuck. Ask the team.
title: "Help: "
body:
  - type: input
    id: who
    attributes:
      label: Who is asking?
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Exact error message or output
      description: Paste it. Do not paste passwords, keys, or private information.
      render: shell
  - type: dropdown
    id: blocking
    attributes:
      label: Is this blocking your work?
      options:
        - Yes, I cannot continue
        - Partly
        - No
    validations:
      required: true
  - type: input
    id: helper
    attributes:
      label: Who might be able to help?
